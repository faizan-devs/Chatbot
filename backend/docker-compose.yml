services:
  postgres:
    image: postgres:17
    container_name: alice-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice_dev_password
      POSTGRES_DB: alice_dev

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres_data:
