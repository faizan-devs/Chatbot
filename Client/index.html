<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Alice | ChatGPT API</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<main class="app-shell">
			<aside class="workspace-rail" aria-label="Chat workspace">
				<div class="brand-lockup">
					<div class="brand-mark" aria-hidden="true">
						<span class="material-symbols-rounded">auto_awesome</span>
					</div>
					<div>
						<p class="eyebrow">Simple Chatbot</p>
						<h1>Alice</h1>
					</div>
				</div>

				<button type="button" class="new-chat-button" id="new-chat">
					<span class="material-symbols-rounded" aria-hidden="true">add</span>
					<span>New chat</span>
				</button>

				<nav class="conversation-list" aria-label="Conversation shortcuts">
					<button type="button" class="active">
						<span class="material-symbols-rounded" aria-hidden="true">forum</span>
						<span>Current chat</span>
					</button>
					<button type="button">
						<span class="material-symbols-rounded" aria-hidden="true">image</span>
						<span>Image prompts</span>
					</button>
					<button type="button">
						<span class="material-symbols-rounded" aria-hidden="true">code</span>
						<span>Code help</span>
					</button>
				</nav>

				<div class="system-status" aria-label="ChatGPT API status">
					<span class="status-dot" aria-hidden="true"></span>
					<div>
						<strong>Online</strong>
						<span>ChatGPT API</span>
					</div>
				</div>
			</aside>

			<section class="chatbot-popup" aria-label="AI chatbot">
				<header class="chat-header">
					<div class="header-info">
						<svg
							class="chatbot-logo"
							xmlns="http://www.w3.org/2000/svg"
							width="50"
							height="50"
							viewBox="0 0 1024 1024"
							aria-hidden="true"
						>
							<path
								d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"
							></path>
						</svg>
						<div>
							<p class="eyebrow">ChatGPT API</p>
							<h2 class="logo-text">Alice</h2>
						</div>
					</div>
					<button
						type="button"
						id="clear-chat"
						class="material-symbols-rounded"
						aria-label="Clear chat"
						title="Clear chat"
					>
						restart_alt
					</button>
				</header>

				<div class="chat-body" aria-live="polite">
					<div class="message bot-message">
						<svg
							class="bot-avatar"
							xmlns="http://www.w3.org/2000/svg"
							width="50"
							height="50"
							viewBox="0 0 1024 1024"
							aria-hidden="true"
						>
							<path
								d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"
							></path>
						</svg>
						<div class="message-text">
							Hi, I am Alice.<br />
							How can I help you today?
						</div>
					</div>
				</div>

				<footer class="chat-footer">
					<form action="#" class="chat-form">
						<textarea
							placeholder="Ask anything"
							class="message-input"
							rows="1"
							required
						></textarea>
						<div class="chat-controls">
							<button
								type="button"
								id="emoji-picker"
								class="material-symbols-rounded"
								aria-label="Open emoji picker"
								title="Emoji"
							>
								sentiment_satisfied
							</button>
							<div class="file-upload-wrapper">
								<input type="file" accept="image/*" id="file-input" hidden />
								<img src="#" alt="Selected upload preview" />
								<button
									type="button"
									id="file-upload"
									class="material-symbols-rounded"
									aria-label="Attach image"
									title="Attach image"
								>
									attach_file
								</button>
								<button
									type="button"
									id="file-cancel"
									class="material-symbols-rounded"
									aria-label="Remove attached image"
									title="Remove image"
								>
									close
								</button>
							</div>
							<button
								type="submit"
								id="send-message"
								class="material-symbols-rounded"
								aria-label="Send message"
								title="Send"
							>
								arrow_upward
							</button>
						</div>
					</form>
				</footer>
			</section>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
		<script src="./script.js"></script>
	</body>
</html>
